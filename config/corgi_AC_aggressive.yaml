data:
  cache_images: false
  end_frame: 3010
  eval: false
  images: images
  init_point_cloud_path: '/media/data/freetimegs/data/corgi-release/sharptime_init.ply'
  model_path: /media/data/freetimegs/res/corgi/AC_aggressive
  normalized_t: false
  num_workers: 0
  resolution: 4
  source_path: /media/data/freetimegs/data/corgi-release/
  start_frame: 2950
  test_cameras:
  - ''
  train_cameras: null
  white_background: false

# ---------------------------------------------------------------------------
# Combined & Aggressive: A + C
#
#   Training schedule (50k total)
#   Phase 1  [ 0 –  10k] Joint: geometry formation
#   Phase 2  [10k –  25k] Dynamic focus: static grads zeroed, dynamic grad
#                          boosted, SAM2 loss boost active
#   Refine   [25k –  50k] Joint: appearance refinement, no densification
#
# Changes from baseline (corgi_edge_optim):
#
#   [A] Dynamic splits — primary driver of dynamic PSNR gain
#       decouple_dynamic_n_split:      3    →  5     (A was 4; push further)
#       decouple_dynamic_densify_mult: 0.5  →  0.33  (A was 0.4; ~3× grad boost)
#
#   [C] SAM2 loss boost — focuses loss energy on dynamic regions longer
#       max_dynamic_boost:             4.0  →  8.0   (C was 6.0; push further)
#       dynamic_boost_end_iter:      15000  →  22000 (C was 20000; extend ramp)
#       dynamic_boost_curve_power:     3.0  →  1.5   (C was 2.0; flatter curve
#                                                     = boost stays elevated longer)
# ---------------------------------------------------------------------------

iterations: 50000

densify:
  densify_from_iter: 500
  densify_until_iter: 25000
  densify_interval: 100
  densify_grad_threshold: 0.0001
  densify_grad_threshold_final: 0.0001
  opacity_reset_until_iter: 12000
  prune_opacity_threshold: 0.005
  prune_from_iter: 500
  percent_dense: 0.01
  N_split: 2
  max_num_gaussians: 4500000      # hard cap: skip densify above this to prevent OOM
  velocity_normalizer: 2.0
  scale_shrink_multiplier: 2.0
  min_dynamic_scale_denominator: 1e-6
  clone_speed_shrink_coeff: 0.75
  split_scale_shrink_base: 0.8

model:
  mode: sharptime
  percent_dense: 0.01
  sh_degree: 3

optim:
  feature_lr: 0.0025
  iterations: 50000
  lambda_dssim: 0.2
  opacity_lr: 0.025
  position_lr_final: 1.6e-06
  position_lr_init: 0.00016
  rotation_lr: 0.001
  scaling_lr: 0.005
  t_lr: 0.0001
  t_scale_lr: 0.005
  velocity_lr: 0.00016
  r_lr: 0.001
  opacity_reset_until_iter: 12000

trainer:
  lambda_reg: 0.01
  log_interval: 10
  relocation_interval: 100
  save_interval: 5000
  test_interval: 5000
  opacity_reset_until_iter: 12000

  # --- Phase schedule -------------------------------------------------------
  decouple_training_enabled: true
  decouple_joint_end_iter: 10000
  decouple_dynamic_end_iter: 25000
  decouple_static_duration_threshold: 0.5
  # [A] 3× gradient boost for dynamic Gaussians (baseline: 2×)
  decouple_dynamic_densify_mult: 0.33
  # [A] 5 children per split event on dynamic Gaussians (baseline: 3)
  decouple_dynamic_n_split: 5

  # --- SAM2-based dynamic loss boost ----------------------------------------
  dynamic_weighting_enabled: true
  sam2_masks_dir: '/media/data/freetimegs/data/corgi-release/masks'
  dynamic_boost_start_iter: 10000
  # [C] Ramp from 10k → 22k (baseline: 10k → 15k)
  dynamic_boost_end_iter: 22000
  # [C] Peak boost 8× (baseline: 4×)
  max_dynamic_boost: 8.0
  # [C] Flatter sigmoid curve — boost stays near peak for longer (baseline: 3.0)
  dynamic_boost_curve_power: 1.5

  # --- SharpTimeGS regularization -------------------------------------------
  lambda_scale: 0.01
  lambda_lifespan: 0.01
  lambda_n: 0.01

  # --- FreeTimeGS++ color correction ----------------------------------------
  color_correction_enabled: true
  cc_lr: 0.001
  lambda_cc: 0.001

  # --- Motion blur penalty --------------------------------------------------
  motion_blur_start_iter: 15000
  lambda_motion_blur: 0.05
  motion_blur_speed_threshold: 2.0
