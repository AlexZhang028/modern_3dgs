name: modern_gs
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - cuda-toolkit=12.8
  - pip
  - colmap=3.13.0         # headless SfM/MVS; SharpTimeGS initialization
  - pip:
    - torch==2.7.0+cu128
    - torchvision==0.22.0+cu128
    # - torchaudio==2.2.1+cu128
    - --extra-index-url https://download.pytorch.org/whl/cu128
    - numpy==1.26.0
    - opencv-python==4.9.0.80
    - plyfile
    - tqdm
    - pyyaml
    - tensorboard
    - scipy
    - pillow
    - lpips
    - scikit-learn
    - matplotlib
    - sam2                      # SAM2 video segmentation; dynamic-region masking
    # - diff-gaussian-rasterization  # Requires submodule
    # - simple-knn                   # Requires submodule
    # - fused-ssim
